<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Speaker</title>
<style>
@font-face{font-family:"DIN Next";src:url("../fonts/DINNextW1G-Regular.otf") format("opentype");font-weight:400;font-style:normal;}
@font-face{font-family:"DIN Next";src:url("../fonts/DINNextW1G-Italic.otf") format("opentype");font-weight:400;font-style:italic;}
@font-face{font-family:"DIN Next";src:url("../fonts/DINNextW1G-Medium.otf") format("opentype");font-weight:500;font-style:normal;}
@font-face{font-family:"DIN Next";src:url("../fonts/DINNextW1G-Bold.otf") format("opentype");font-weight:700;font-style:normal;}
  :root { --bg:#141414; --fg:#eee; --muted:#888; --accent:#ff7a2f; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"DIN Next",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
  #wrap{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100%;gap:0}
  #top{grid-column:1/3;display:flex;align-items:baseline;gap:28px;padding:18px 28px;border-bottom:1px solid #2a2a2a}
  #title{font-size:26px;font-weight:600}
  #pos{color:var(--muted);font-variant-numeric:tabular-nums;font-size:18px}
  #beat{color:var(--accent);font-variant-numeric:tabular-nums;font-size:18px}
  #main{display:flex;flex-direction:column;min-height:0}
  #pv{position:relative;flex:none;width:640px;max-width:calc(100% - 64px);aspect-ratio:16/9;margin:20px 32px 0;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #333}
  #pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}
  #pv .rz{position:absolute;z-index:2}
  #pv .rz.r{top:0;right:0;width:12px;height:100%;cursor:ew-resize}
  #pv .rz.b{left:0;bottom:0;width:100%;height:12px;cursor:ns-resize}
  #pv .rz.c{right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.35) 50%);border-bottom-right-radius:10px}
  #pv .rz:hover,#pv.drag .rz{background-color:rgba(255,122,47,.35)}
  #pv.drag{box-shadow:0 0 0 2px var(--accent)}
  #pvlbl{position:absolute;right:30px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
  #notes{flex:1;min-height:0;padding:22px 32px 28px;font-size:26px;line-height:1.5;overflow:auto}
  #notes p{margin:0 0 18px}
  #notes .b{display:inline-block;min-width:44px;color:var(--accent);font-variant-numeric:tabular-nums}
  #notes .b.now{background:var(--accent);color:#000;border-radius:6px;padding:0 8px}
.delta{font-size:14px;color:#999;margin-top:4px;font-family:"DIN Next",ui-monospace,monospace}
  .delta.ok{color:#2b8a3e}.delta.warn{color:#d9480f}.delta.late{color:#c92a2a;font-weight:700}
  #expected{font-size:44px;color:#666;font-variant-numeric:tabular-nums}
  .ver{font-size:13px;color:#999;font-family:"DIN Next",ui-monospace,monospace}
  .ver b{color:#666;font-weight:600}
  #notes .cue{color:#cbb;font-style:italic}
  #notes .dir{color:#8a8;font-size:.85em;font-family:"DIN Next",ui-monospace,monospace}
  #side{border-left:1px solid #2a2a2a;padding:24px;display:flex;flex-direction:column;gap:22px}
  #clock{font-size:64px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #elapsed{font-size:44px;color:var(--accent);font-variant-numeric:tabular-nums}
  .budget{font-size:15px;color:#aaa;line-height:1.4;margin-top:8px;font-variant-numeric:tabular-nums}
  .lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
  #next{font-size:20px;color:#ccc}
  .keys{margin-top:auto;color:#666;font-size:13px;line-height:1.7}
  button{background:#222;color:#eee;border:1px solid #333;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><span id="title">—</span><span id="pos"></span><span id="beat"></span></div>
  <div id="main">
    <div id="pv"><iframe id="pvf" src="index.html?preview=1" tabindex="-1" aria-hidden="true"></iframe><span id="pvlbl"></span><i class="rz r"></i><i class="rz b"></i><i class="rz c"></i></div>
    <div id="notes"><p class="cue">Waiting for the deck… (press S in the deck window, or click ↻)</p></div>
  </div>
  <div id="side">
    <div><div class="lbl">Clock</div><div id="clock">--:--</div></div>
    <div><div class="lbl">Elapsed</div><div id="elapsed">00:00</div><div id="budget" class="budget" hidden></div></div>
    <div><div class="lbl">Expected</div><div id="expected">--:--</div><div id="delta" class="delta"></div></div>
    <div><div class="lbl">Next</div><div id="next">—</div></div>
    <div class="row">
      <button onclick="cmd('prev')">◀ prev</button>
      <button onclick="cmd('next')">next ▶</button>
      <button onclick="cmd('reset')">R reset</button>
      <button onclick="cmd('timer')">⏱ restart</button>
      <button onclick="cmd('hello')">↻</button>
    </div>
    <div class="ver">deck version <b id="ver">—</b> <span id="others" style="color:#e8a33d"></span></div>
    <div class="keys">→ / Space next beat · ← back · Shift+→ skip slide<br>R reset demo · V fallback image · T restart timer · F fullscreen</div>
  </div>
</div>
<script>
  const deckId = new URL('.', location.href).pathname;
  const ch = new BroadcastChannel('deck:' + deckId);
  let t0 = null;
  // follow one deck tab only: the one that opened this window (?inst=…), else the first that answers
  let lock = new URL(location.href).searchParams.get('inst');
  const others = new Set();
  function cmd(c){ ch.postMessage({type:'cmd', deckId, inst: lock, cmd:c}); }
  ch.onmessage = (ev) => {
    const s = ev.data; if (s.type !== 'state' || s.deckId !== deckId) return;
    if (!lock && s.inst) lock = s.inst;
    if (lock && s.inst !== lock) { others.add(s.inst || 'old'); document.getElementById('others').textContent = `${others.size} other deck tab${others.size > 1 ? 's' : ''} open (ignored)`; return; }
    document.getElementById('title').textContent = s.title || '(untitled)';
    document.getElementById('pos').textContent = `slide ${s.cur+1} / ${s.total}`;
    document.getElementById('beat').textContent = s.beats ? `beat ${s.beat} / ${s.beats}` : '';
    document.getElementById('next').textContent = s.nextTitle;
    t0 = s.t0 || t0;
    exp = { start: s.expStart || 0, dur: s.expDur || 0, beat: s.beat, beats: s.beats, total: s.expTotal || 0 };
    const budget = document.getElementById('budget');
    budget.hidden = !s.qaMinutes;
    budget.textContent = s.qaMinutes ? `Talk ${mmss(exp.total*60)} · Q&A ${mmss(s.qaMinutes*60)}` : '';
    tickExp();
    document.getElementById('ver').textContent = s.version || '(unknown)';
    const newSlide = s.cur !== lastCur; lastCur = s.cur;
    showPreview(s.cur, s.beat, s.beats);
    renderNotes(s.notes, s.beat, newSlide);
  };
  let lastCur = -1;
  // a live thumbnail of the deck, held at the same slide and click, so you can see how far the animation has gone
  const pvf = document.getElementById('pvf');
  let pvAt = null;
  function showPreview(cur, beat, beats){
    pvAt = { cur, beat };
    document.getElementById('pvlbl').textContent = beats ? `click ${beat} / ${beats}` : 'no clicks';
    pvf.contentWindow?.postMessage({ type: 'deck-preview', cur, beat }, '*');
  }
  pvf.addEventListener('load', () => cmd('hello'));   // once the copy is up, ask the deck where it is
  function fitPreview(){ const box = document.getElementById('pv'); pvf.style.transform = `scale(${box.clientWidth / 1920})`; }
  new ResizeObserver(fitPreview).observe(document.getElementById('pv'));
  // drag the thumbnail's right or bottom edge (or corner) to resize it; the width is remembered
  (function(){
    const box = document.getElementById('pv');
    try { const w = +localStorage.getItem('speaker:pvw'); if (w) box.style.width = w + 'px'; } catch (e) {}
    box.querySelectorAll('.rz').forEach(h => h.addEventListener('pointerdown', (e) => {
      e.preventDefault(); h.setPointerCapture(e.pointerId); box.classList.add('drag');
      const x0 = e.clientX, y0 = e.clientY, w0 = box.clientWidth, byHeight = h.classList.contains('b');
      const move = (ev) => {
        const w = byHeight ? w0 + (ev.clientY - y0) * 16 / 9 : w0 + (ev.clientX - x0);
        box.style.width = Math.max(220, Math.round(w)) + 'px';
      };
      const up = () => {
        box.classList.remove('drag'); h.removeEventListener('pointermove', move);
        try { localStorage.setItem('speaker:pvw', box.clientWidth); } catch (e) {}
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up, { once: true });
    }));
  })();
  function renderNotes(html, beat, newSlide){
    // Notes are plain lines. Lines starting with "[n]" are beat cues; the current one is highlighted.
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const lines = tmp.textContent.split('\n').map(l=>l.trim()).filter(Boolean);
    const out = lines.map(l => {
      const m = l.match(/^\[(\d+)\]\s*(.*)$/);
      if (m) return `<p><span class="b ${+m[1]===beat?'now':''}">[${m[1]}]</span> ${esc(m[2])}</p>`;
      if (/^>/.test(l)) return `<p class="cue">${esc(l.replace(/^>\s?/,''))}</p>`;
      if (/^\/\//.test(l)) return `<p class="dir">${esc(l.replace(/^\/\/\s?/,''))}</p>`;
      return `<p>${esc(l)}</p>`;
    }).join('');
    document.getElementById('notes').innerHTML = out || '<p class="cue">(no notes)</p>';
    // a new slide starts at the top of its notes; within a slide, keep the current click's line in view
    const box = document.getElementById('notes');
    if (newSlide || !beat) box.scrollTop = 0;
    else { const now = document.querySelector('.b.now'); if (now) now.scrollIntoView({block:'center'}); }
  }
  let exp = null;
  const mmss = (sec) => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
  function tickExp(){
    if (!exp) return;
    // where you should be right now: start of this slide + the share of it covered by the current beat
    const frac = exp.beats ? exp.beat / exp.beats : 0;
    const target = (exp.start + exp.dur * frac) * 60;
    document.getElementById('expected').textContent = mmss(target);
    const el = document.getElementById('delta');
    if (!t0) { el.textContent = `this slide: ${mmss(exp.start*60)}–${mmss((exp.start+exp.dur)*60)}`; el.className = 'delta'; return; }
    const d = (Date.now() - t0) / 1000 - target;
    el.textContent = (Math.abs(d) < 30 ? 'on time' : (d > 0 ? `${mmss(d)} behind` : `${mmss(-d)} ahead`)) + ` · slide ${mmss(exp.start*60)}–${mmss((exp.start+exp.dur)*60)}`;
    el.className = 'delta ' + (d > 90 ? 'late' : d > 30 ? 'warn' : 'ok');
  }
  setInterval(tickExp, 1000);
  function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function pad(n){ return String(n).padStart(2,'0'); }
  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (t0) { const e = Math.floor((Date.now()-t0)/1000); document.getElementById('elapsed').textContent = `${pad(Math.floor(e/60))}:${pad(e%60)}`; }
  }, 500);
  document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); cmd('next'); }
    else if (e.key==='ArrowLeft') { e.preventDefault(); cmd('prev'); }
    else if (e.key==='r'||e.key==='R') cmd('reset');
  });
  cmd('hello');
</script>
</body>
</html>
